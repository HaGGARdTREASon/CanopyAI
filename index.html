<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hosted Gemma AI Space</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Gemma AI Generator</h1>
    <p class="subtitle">Connected to local Gemma 2B via secure tunnel</p>

    <div class="input-group">
      <label for="prompt">Prompt:</label>
      <textarea id="prompt" rows="4" placeholder="Type a message or question..."></textarea>
    </div>

    <button id="generate-btn">Generate Response</button>

    <div class="output-group">
      <label>Status / Response:</label>
      <div id="status" class="status-box">Ready.</div>
      <div id="output" class="output-box"></div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
