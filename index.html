<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local AI Assistant Interface</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Gemma 4 AI Assistant</h1>
        <p class="subtitle">Connected to local Gemma 4 (E2B) backend</p>

        <div class="input-group">
            <label for="api-url">API Endpoint URL:</label>
            <input type="text" id="api-url" placeholder="http://localhost:8000/v1/chat/completions" />
        </div>

        <div class="input-group">
            <label for="api-key">API Key:</label>
            <input type="password" id="api-key" placeholder="sk-my-secret-key-12345" />
        </div>

        <div class="input-group">
            <label for="model-name">Model Name:</label>
            <input type="text" id="model-name" placeholder="gemma4:e2b" />
        </div>

        <div class="input-group">
            <label for="prompt">Prompt:</label>
            <textarea id="prompt" rows="4" placeholder="Type a message or question..."></textarea>
        </div>

        <button id="generate-btn">Generate Response</button>

        <div class="output-group">
            <label>Status / Response:</label>
            <div id="status" class="status-box">Ready.</div>

            <!-- Collapsible thinking process box -->
            <details id="thinking-container" class="thinking-box" style="display: none;" open>
                <summary>🧠 Thinking Process</summary>
                <div id="thinking" class="thinking-content"></div>
            </details>

            <div id="output" class="output-box"></div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
