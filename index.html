<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qwen 2.5 Claymorphic Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="clay-card">
        <header class="card-header">
            <div class="brand">
                <div class="logo-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a8 8 0 0 0-8 8c0 1.5.4 2.9 1.2 4.1L3 21l6.9-2.2c1.2.8 2.6 1.2 4.1 1.2a8 8 0 0 0 8-8 8 8 0 0 0-8-8z" />
                        <circle cx="12" cy="10" r="1" />
                        <circle cx="8" cy="10" r="1" />
                        <circle cx="16" cy="10" r="1" />
                    </svg>
                </div>
                <div>
                    <h1>Qwen 2.5 Studio</h1>
                    <p class="subtitle">Local Ollama Gateway • Live Generation</p>
                </div>
            </div>
            <span class="version-badge">v0.5B</span>
        </header>

        <div class="config-grid">
            <div class="input-group">
                <label for="api-url">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" /><line x1="2" y1="12" x2="22" y2="12" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></svg>
                    API Endpoint
                </label>
                <input type="text" id="api-url" class="clay-input" placeholder="http://localhost:8000/v1/chat/completions" />
            </div>

            <div class="input-group">
                <label for="model-name">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><line x1="9" y1="1" x2="9" y2="4" /><line x1="15" y1="1" x2="15" y2="4" /><line x1="9" y1="20" x2="9" y2="23" /><line x1="15" y1="20" x2="15" y2="23" /><line x1="20" y1="9" x2="23" y2="9" /><line x1="20" y1="15" x2="23" y2="15" /><line x1="1" y1="9" x2="4" y2="9" /><line x1="1" y1="15" x2="4" y2="15" /></svg>
                    Model
                </label>
                <input type="text" id="model-name" class="clay-input" placeholder="qwen2.5:0.5b" />
            </div>
        </div>

        <div class="input-group">
            <label for="prompt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></svg>
                Prompt Instruction
            </label>
            <textarea id="prompt" class="clay-input clay-textarea" rows="4" placeholder="Enter instructions or questions for Qwen 2.5..."></textarea>
        </div>

        <button id="generate-btn" class="clay-btn">
            <span id="btn-text">Generate Response</span>
            <svg id="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></svg>
        </button>

        <section class="output-group">
            <div class="status-header">
                <label>Assistant Output</label>
                <div id="status" class="status-pill">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="status-text">Ready</span>
                </div>
            </div>

            <details id="thinking-container" class="thinking-box clay-inset" style="display: none;" open>
                <summary>
                    <span class="summary-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.04z" /><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.04z" /></svg>
                        Reasoning Process
                    </span>
                    <span class="chevron">▼</span>
                </summary>
                <div id="thinking" class="thinking-content"></div>
            </details>

            <div id="output" class="output-box clay-inset">
                <span class="placeholder-text">Awaiting your prompt above...</span>
            </div>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
