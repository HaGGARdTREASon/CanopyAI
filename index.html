<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI STUDIO</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            
            /* Strict Light Mode Palette */
            --bg-light: #e8eef6;
            --clay-card-bg: rgba(235, 241, 248, 0.75); /* Clay base with glass translucency */
            --clay-inset-bg: #dbe4f0;
            
            --accent-blue: #0284c7;
            --accent-indigo: #4f46e5;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            /* 3D Claymorphism Light Shadows */
            --clay-outer-shadow: 20px 20px 40px #b8c4d4, -20px -20px 40px #ffffff;
            --clay-inner-light: inset 6px 6px 12px rgba(255, 255, 255, 0.9);
            --clay-inner-dark: inset -6px -6px 12px rgba(160, 175, 200, 0.6);
            
            /* Inset Clay Shadows for Inputs */
            --inset-shadow: inset 6px 6px 12px #c1cbd8, inset -6px -6px 12px #ffffff;
            
            /* Glassmorphism Accents */
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: 1px solid rgba(255, 255, 255, 0.8);
            --glass-blur: blur(16px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-light);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient 3D Decorative Orbs & Graphics */
        .background-orbs {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.7;
            animation: float 14s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            top: -80px;
            left: 8%;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, #a5f3fc, #c084fc);
            bottom: -100px;
            right: 8%;
            animation-delay: -6s;
        }

        .orb-3 {
            width: 280px;
            height: 280px;
            background: linear-gradient(135deg, #67e8f9, #38bdf8);
            top: 35%;
            right: 25%;
            animation-delay: -10s;
        }

        .clay-graphic-ring {
            position: absolute;
            top: 10%;
            right: 12%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--bg-light);
            box-shadow: 10px 10px 20px #b8c4d4, -10px -10px 20px #ffffff;
            z-index: 0;
            opacity: 0.6;
            animation: rotate-float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(35px, 45px) scale(1.08); }
        }

        @keyframes rotate-float {
            0% { transform: rotate(0deg) translateY(0); }
            50% { transform: rotate(180deg) translateY(-15px); }
            100% { transform: rotate(360deg) translateY(0); }
        }

        /* Main Claymorphic + Glassmorphic Container */
        .clay-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 720px;
            background: var(--clay-card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 2.5rem;
            border-radius: 38px;
            box-shadow: var(--clay-outer-shadow), var(--clay-inner-light), var(--clay-inner-dark);
            border: var(--glass-border);
        }

        /* Header & Brand */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1.1rem;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 6px 8px 16px rgba(2, 132, 199, 0.35), inset 3px 3px 6px rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.83rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .version-badge {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--accent-indigo);
            font-size: 0.78rem;
            font-weight: 800;
            padding: 0.45rem 0.9rem;
            border-radius: 14px;
            border: var(--glass-border);
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.04);
        }

        @media (max-width: 600px) {
            .clay-card { padding: 1.6rem; }
        }

        .input-group {
            margin-bottom: 1.3rem;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        label svg {
            color: var(--accent-blue);
        }

        /* Inset Clay Inputs */
        .clay-input {
            width: 100%;
            background-color: var(--clay-inset-bg);
            border: none;
            color: var(--text-primary);
            padding: 0.95rem 1.15rem;
            border-radius: 20px;
            font-size: 0.92rem;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            box-shadow: var(--inset-shadow);
            transition: all 0.25s ease;
        }

        .clay-input::placeholder {
            color: var(--text-muted);
            font-weight: 500;
        }

        .clay-input:focus {
            box-shadow: inset 8px 8px 14px #b0bbc9, inset -8px -8px 14px #ffffff, 0 0 0 2px rgba(2, 132, 199, 0.4);
        }

        .clay-textarea {
            resize: vertical;
            min-height: 110px;
            line-height: 1.55;
        }

        /* Tactile 3D Clay Button */
        .clay-btn {
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: #ffffff;
            border: none;
            padding: 1.1rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            border-radius: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.65rem;
            box-shadow: 
                10px 10px 22px #b2bdcd,
                -10px -10px 22px #ffffff,
                inset 4px 4px 8px rgba(255, 255, 255, 0.5),
                inset -4px -4px 8px rgba(0, 0, 0, 0.25);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 0.5rem;
        }

        .clay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                14px 14px 26px #a6b2c2,
                -14px -14px 26px #ffffff,
                inset 4px 4px 8px rgba(255, 255, 255, 0.6),
                inset -4px -4px 8px rgba(0, 0, 0, 0.25);
        }

        .clay-btn:active {
            transform: translateY(2px);
            box-shadow: inset 5px 5px 10px rgba(0, 0, 0, 0.4), inset -3px -3px 6px rgba(255, 255, 255, 0.3);
        }

        .clay-btn:disabled {
            background: #cbd5e1;
            box-shadow: var(--inset-shadow);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .spin-icon { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Output & Status Styling */
        .output-group {
            margin-top: 1.8rem;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.7rem;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.4rem 0.95rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent-blue);
            border: var(--glass-border);
            box-shadow: 3px 3px 8px rgba(0,0,0,0.03);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: var(--accent-indigo);
            animation: pulse-ring 1.2s infinite ease-out;
        }

        .status-dot.completed { background-color: var(--accent-green); }
        .status-dot.error { background-color: var(--accent-red); }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(79, 70, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }

        .clay-inset {
            background-color: var(--clay-inset-bg);
            border-radius: 24px;
            padding: 1.3rem;
            box-shadow: var(--inset-shadow);
        }

        .thinking-box {
            margin-bottom: 1.1rem;
        }

        .thinking-box summary {
            cursor: pointer;
            font-weight: 700;
            color: var(--accent-indigo);
            font-size: 0.85rem;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
        }

        .thinking-box summary::-webkit-details-marker { display: none; }
        .summary-title { display: flex; align-items: center; gap: 0.45rem; }

        .chevron { font-size: 0.7rem; transition: transform 0.2s ease; }
        details[open] .chevron { transform: rotate(180deg); }

        .thinking-content {
            margin-top: 0.8rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: pre-wrap;
            font-family: ui-monospace, Consolas, monospace;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
        }

        .output-box {
            min-height: 120px;
            white-space: pre-wrap;
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .placeholder-text {
            color: var(--text-muted);
            font-weight: 500;
        }

        .error-box {
            color: var(--accent-red);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Animated Cursor */
        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 1.15em;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            margin-left: 4px;
            vertical-align: -2px;
            border-radius: 3px;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
            animation: blink-cursor 0.75s infinite;
        }

        @keyframes blink-cursor {
            0%, 100% { opacity: 1; transform: scaleY(1); }
            50% { opacity: 0.25; transform: scaleY(0.85); }
        }

        .thinking-content::-webkit-scrollbar,
        .output-box::-webkit-scrollbar {
            width: 6px;
        }

        .thinking-content::-webkit-scrollbar-thumb,
        .output-box::-webkit-scrollbar-thumb {
            background: #b8c4d4;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- Background Pastel Orbs & Graphic Ring -->
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="clay-graphic-ring"></div>
    </div>

    <!-- Main Card -->
    <main class="clay-card">
        <header class="card-header">
            <div class="brand">
                <div class="logo-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a8 8 0 0 0-8 8c0 1.5.4 2.9 1.2 4.1L3 21l6.9-2.2c1.2.8 2.6 1.2 4.1 1.2a8 8 0 0 0 8-8 8 8 0 0 0-8-8z"/>
                        <circle cx="12" cy="10" r="1"/>
                        <circle cx="8" cy="10" r="1"/>
                        <circle cx="16" cy="10" r="1"/>
                    </svg>
                </div>
                <div>
                    <h1>AI Studio</h1>
                    <p class="subtitle">Local LLM</p>
                </div>
            </div>
            <span class="version-badge">500M parameters</span>
        </header>

        <div class="input-group">
            <label for="prompt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Prompt Instruction
            </label>
            <textarea id="prompt" class="clay-input clay-textarea" rows="4" placeholder="Enter your thoughts here"></textarea>
        </div>

        <button id="generate-btn" class="clay-btn">
            <span id="btn-text">Generate Response</span>
            <svg id="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>

        <section class="output-group">
            <div class="status-header">
                <label>Assistant Output</label>
                <div id="status" class="status-pill">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="status-text">Ready</span>
                </div>
            </div>

            <details id="thinking-container" class="thinking-box clay-inset" style="display: none;" open>
                <summary>
                    <span class="summary-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.04z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.04z"/></svg>
                        Reasoning Process
                    </span>
                    <span class="chevron">▼</span>
                </summary>
                <div id="thinking" class="thinking-content"></div>
            </details>

            <div id="output" class="output-box clay-inset">
                <span class="placeholder-text">Awaiting your prompt above...</span>
            </div>
        </section>
    </main>

    <script>
        const API_URL = "http://localhost:8000/v1/chat/completions";
        const MODEL_NAME = "qwen2.5:0.5b";

        const promptInput = document.getElementById('prompt');
        const generateBtn = document.getElementById('generate-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const outputDiv = document.getElementById('output');
        const thinkingContainer = document.getElementById('thinking-container');
        const thinkingDiv = document.getElementById('thinking');

        async function typeText(targetElement, fullText, speedMs = 10) {
            targetElement.innerHTML = "";
            
            const cursor = document.createElement("span");
            cursor.className = "typing-cursor";
            targetElement.appendChild(cursor);

            for (let i = 0; i < fullText.length; i++) {
                cursor.insertAdjacentText("beforebegin", fullText[i]);
                targetElement.scrollTop = targetElement.scrollHeight;
                
                const char = fullText[i];
                let delay = speedMs;
                if (char === '.' || char === '?' || char === '!') delay = speedMs * 4;
                else if (char === ',' || char === '\n') delay = speedMs * 2.5;

                await new Promise(resolve => setTimeout(resolve, delay));
            }

            await new Promise(resolve => setTimeout(resolve, 600));
            cursor.remove();
        }

        generateBtn.addEventListener('click', async () => {
            const promptText = promptInput.value.trim();

            if (!promptText) {
                alert("Please enter a prompt instruction.");
                return;
            }

            generateBtn.disabled = true;
            btnText.innerText = "Generating...";
            btnIcon.classList.add("spin-icon");
            
            statusText.innerText = "Connecting...";
            statusDot.className = "status-dot active";
            
            outputDiv.innerHTML = `<span class="placeholder-text">Awaiting response from gateway...</span>`;
            thinkingDiv.innerText = "";
            thinkingContainer.style.display = "none";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "true"
                    },
                    body: JSON.stringify({
                        prompt: promptText,
                        model: MODEL_NAME
                    })
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch {
                    throw new Error(`Non-JSON response (${response.status}): ${responseText.slice(0, 150)}`);
                }

                if (!response.ok) {
                    throw new Error(data.detail || data.error?.message || `HTTP ${response.status} Error`);
                }

                const messageObj = data.choices?.[0]?.message || {};
                let rawContent = messageObj.content || "";
                let thinkingText = messageObj.reasoning_content || "";

                if (!thinkingText) {
                    const thinkMatch = rawContent.match(/<(think|thought)>([\s\S]*?)<\/\1>/i);
                    if (thinkMatch) {
                        thinkingText = thinkMatch[2].trim();
                        rawContent = rawContent.replace(/<(think|thought)>([\s\S]*?)<\/\1>/i, '').trim();
                    }
                }

                if (thinkingText) {
                    thinkingDiv.innerText = thinkingText;
                    thinkingContainer.style.display = "block";
                }

                statusText.innerText = "Streaming Output...";
                await typeText(outputDiv, rawContent, 12);

                statusText.innerText = "Completed";
                statusDot.className = "status-dot completed";

            } catch (error) {
                statusText.innerText = "Error";
                statusDot.className = "status-dot error";
                outputDiv.innerHTML = `<div class="error-box"><strong>Error:</strong> ${error.message}</div>`;
                console.error("API Error:", error);
            } finally {
                generateBtn.disabled = false;
                btnText.innerText = "Generate Response";
                btnIcon.classList.remove("spin-icon");
            }
        });
    </script>
</body>
</html>
